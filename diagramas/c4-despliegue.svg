<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="850" viewBox="0 0 1720 850" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#707070"/>
    </marker>
  </defs>
  <rect width="1720" height="850" fill="#ffffff"/>

  <text x="860" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#000">Diagrama de despliegue (C4)</text>
  <text x="860" y="78" text-anchor="middle" font-size="18" fill="#000">Sistema de Pedidos Mayoristas - Laboratorio Químico Delta</text>

  <!-- Repositorio GitHub -->
  <rect x="710" y="110" width="300" height="86" rx="12" fill="#999999" stroke="#7a7a7a"/>
  <text x="860" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Repositorio GitHub</text>
  <text x="860" y="170" text-anchor="middle" font-size="15" fill="#fff">[Rama main]</text>

  <!-- Nodo 1: equipo del usuario -->
  <rect x="40" y="270" width="400" height="300" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="14 8"/>
  <rect x="70" y="340" width="340" height="150" rx="12" fill="#999999" stroke="#7a7a7a"/>
  <text x="240" y="385" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Navegador web</text>
  <text x="240" y="409" text-anchor="middle" font-size="15" fill="#fff">[Chrome, Edge o Firefox]</text>
  <text x="240" y="450" text-anchor="middle" font-size="15" fill="#fff">Muestra las páginas y envía</text>
  <text x="240" y="470" text-anchor="middle" font-size="15" fill="#fff">los formularios.</text>
  <text x="58" y="534" font-size="16" font-weight="bold" fill="#000">Computadora o celular del usuario</text>
  <text x="58" y="556" font-size="15" fill="#000">[Nodo de despliegue]</text>

  <!-- Nodo 2: Render -->
  <rect x="660" y="270" width="400" height="300" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="14 8"/>
  <rect x="690" y="340" width="340" height="150" rx="12" fill="#438dd5" stroke="#3a7cbd"/>
  <text x="860" y="385" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Aplicación web</text>
  <text x="860" y="409" text-anchor="middle" font-size="15" fill="#fff">[Contenedor: Node.js + Express, MVC con EJS]</text>
  <text x="860" y="450" text-anchor="middle" font-size="15" fill="#fff">Genera las páginas y aplica las</text>
  <text x="860" y="470" text-anchor="middle" font-size="15" fill="#fff">reglas del negocio.</text>
  <text x="678" y="534" font-size="16" font-weight="bold" fill="#000">Render</text>
  <text x="678" y="556" font-size="15" fill="#000">[Web Service Free, Virginia]</text>

  <!-- Nodo 3: Aiven -->
  <rect x="1280" y="270" width="400" height="300" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="14 8"/>
  <path d="M 1310 365 L 1310 465 A 170 20 0 0 0 1650 465 L 1650 365 Z" fill="#438dd5" stroke="#3a7cbd"/>
  <ellipse cx="1480" cy="365" rx="170" ry="20" fill="#4a95de" stroke="#3a7cbd"/>
  <text x="1480" y="400" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Base de datos delta_pedidos</text>
  <text x="1480" y="424" text-anchor="middle" font-size="15" fill="#fff">[Contenedor: MySQL 8.4]</text>
  <text x="1480" y="452" text-anchor="middle" font-size="15" fill="#fff">Guarda usuarios, farmacias,</text>
  <text x="1480" y="472" text-anchor="middle" font-size="15" fill="#fff">medicamentos y pedidos.</text>
  <text x="1298" y="534" font-size="16" font-weight="bold" fill="#000">Aiven for MySQL</text>
  <text x="1298" y="556" font-size="15" fill="#000">[Plan Developer, DigitalOcean Nueva York]</text>

  <!-- Relaciones -->
  <line x1="410" y1="415" x2="690" y2="415" stroke="#707070" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="550" y="400" text-anchor="middle" font-size="16" fill="#000">HTTPS</text>

  <line x1="1030" y1="415" x2="1310" y2="415" stroke="#707070" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="1170" y="333" text-anchor="middle" font-size="14" fill="#000">Consultas SQL parametrizadas</text>
  <text x="1170" y="351" text-anchor="middle" font-size="14" fill="#000">sobre TLS con verificación</text>
  <text x="1170" y="369" text-anchor="middle" font-size="14" fill="#000">del certificado,</text>
  <text x="1170" y="387" text-anchor="middle" font-size="14" fill="#000">usuario delta_app</text>

  <line x1="860" y1="196" x2="860" y2="270" stroke="#707070" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#flecha)"/>
  <text x="876" y="228" font-size="15" fill="#000">Despliegue manual</text>
  <text x="876" y="247" font-size="15" fill="#000">(npm ci --omit=dev, npm start)</text>

  <!-- Leyenda -->
  <rect x="40" y="640" width="1640" height="170" fill="#fff" stroke="#000"/>
  <text x="62" y="672" font-size="17" font-weight="bold" fill="#000">Leyenda</text>
  <rect x="64" y="692" width="90" height="46" rx="8" fill="#438dd5" stroke="#3a7cbd"/>
  <text x="170" y="720" font-size="16" fill="#000">Contenedor</text>
  <rect x="364" y="692" width="90" height="46" rx="8" fill="#999999" stroke="#7a7a7a"/>
  <text x="470" y="720" font-size="16" fill="#000">Navegador y repositorio</text>
  <rect x="764" y="692" width="90" height="46" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="870" y="720" font-size="16" fill="#000">Nodo de despliegue (línea discontinua)</text>
  <line x1="1240" y1="715" x2="1330" y2="715" stroke="#707070" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#flecha)"/>
  <text x="1346" y="720" font-size="16" fill="#000">Despliegue desde el repositorio</text>
  <text x="66" y="782" font-size="15" fill="#000">Los datos de acceso a la base y el nombre del servidor no aparecen en el diagrama: se guardan como variables de entorno en Render.</text>
</svg>
